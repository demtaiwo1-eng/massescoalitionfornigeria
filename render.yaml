services:
  - type: web
    name: mcn-newsroom-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://demtaiwo1-eng.github.io,https://www.massescoalitionfornigeria.com,https://massescoalitionfornigeria.com
      - key: MCN_SETUP_TOKEN
        sync: false
